<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail Siswa — Direktori Siswa</title>
<meta name="theme-color" content="#1f5bd6">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<style>
  .pd-hero { display: flex; flex-direction: column; gap: 10px; padding-bottom: 16px; border-bottom: 2px solid var(--color-divider); }
  .pd-hero .d-name { text-align: left; font-size: 30px; }
  @media (max-width: 720px) {
    .pd-photo-wrap { padding: 24px 16px 0; display: flex; justify-content: center; }
    .pd-hero { align-items: center; padding: 14px 16px 24px; }
    .pd-hero .d-name { text-align: center; font-size: 20px; }
    .pd-desk-only { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="pub-header pd-desk-only">
    <a class="pub-brand" href="/"><span class="mark" aria-hidden="true"></span>Direktori Siswa</a>
    <span class="pub-kicker">Data Publik &middot; Read-only</span>
  </header>
  <div class="d-bar">
    <a href="/" id="back" class="btn btn-icon" aria-label="Kembali ke daftar siswa"></a>
    <div class="d-bar-title">Detail Siswa</div>
  </div>
  <main class="pub-detail" id="detail" aria-live="polite"><div class="empty">Memuat…</div></main>
</div>
<script src="/assets/js/common.js"></script>
<script>
(function () {
  const { api, esc, icon, photo, formatDate, genderLabel, genderTag, rowsHtml } = S;
  const back = document.getElementById('back');
  back.innerHTML = icon('back', 18);
  // Kembali ke list dengan filter sebelumnya bila datang dari landing.
  back.addEventListener('click', (e) => {
    try {
      const ref = new URL(document.referrer);
      if (ref.origin === location.origin && ref.pathname === '/') { e.preventDefault(); history.back(); }
    } catch (_) {}
  });
  const id = location.pathname.split('/').filter(Boolean).pop();
  const el = document.getElementById('detail');
  api('/api/public/siswa/' + encodeURIComponent(id)).then((s) => {
    document.title = s.nama + ' — Direktori Siswa';
    el.innerHTML = `<div class="pub-detail-grid">
      <div class="pd-photo-wrap">${photo(s.foto)}</div>
      <div>
        <div class="pd-hero">
          <div class="d-name">${esc(s.nama)}</div>
          <span class="${genderTag(s.jenisKelamin)}">${esc(genderLabel(s.jenisKelamin))}</span>
        </div>
        <div class="d-fields">${rowsHtml([
          ['Tempat Lahir', s.tempatLahir],
          ['Tanggal Lahir', formatDate(s.tanggalLahir)],
          ['Jenis Kelamin', genderLabel(s.jenisKelamin)],
        ])}</div>
      </div></div>`;
  }).catch((err) => {
    el.innerHTML = `<div class="empty">${err.status === 404 ? 'Data siswa tidak ditemukan.' : esc(err.message)}<br><br><a href="/">Kembali ke daftar siswa</a></div>`;
  });
})();
</script>
</body>
</html>
